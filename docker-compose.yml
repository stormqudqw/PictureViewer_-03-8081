services:
  postgres:
    image: postgres:16-alpine
    container_name: altay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: altay
    ports:
      - '5432:5432'
    volumes:
      - altay-pgdata:/var/lib/postgresql/data

volumes:
  altay-pgdata:
