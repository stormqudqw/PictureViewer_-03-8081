<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f3f1ea">
<title>Табель</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f3f1ea;        /* warm off-white */
    --paper2:#eceae1;
    --ink:#16140f;          /* near-black */
    --ink2:#3a362d;
    --faint:#8a8576;
    --hair:#cdc9bd;         /* hairline */
    --hair2:#ddd9cd;
    --accent:#c4452f;       /* one muted vermilion */
    --accent-ink:#fbf7ef;
    --field:#f8f6f0;
    --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;padding:0}
  input,select{font-family:inherit;font-size:16px}
  ::selection{background:var(--accent);color:var(--accent-ink)}

  /* visible keyboard focus (quality floor) */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- masthead ---------- */
  .mast{
    border-bottom:2px solid var(--ink);
    padding:14px 18px 0;position:sticky;top:0;z-index:40;background:var(--paper);
  }
  .mast-top{display:flex;align-items:baseline;gap:10px}
  .logo{
    font-weight:800;letter-spacing:-.04em;font-size:21px;text-transform:uppercase;
    display:flex;align-items:baseline;gap:9px
  }
  .logo .sq{
    width:13px;height:13px;background:var(--accent);display:inline-block;
    transform:translateY(1px)
  }
  .logo .venue{font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
  .mast-top .sp{flex:1}
  .dots{
    width:34px;height:34px;display:grid;place-items:center;font-size:20px;font-weight:700;
    border:1.5px solid var(--ink);line-height:0;letter-spacing:.06em
  }
  .dots:active{background:var(--ink);color:var(--paper)}

  .mast-row{
    display:flex;align-items:flex-end;gap:14px;padding:14px 0 13px;
  }
  .mast-row .month{
    font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:.9;text-transform:lowercase
  }
  .mast-row .month .yr{font-size:14px;color:var(--faint);font-weight:500;letter-spacing:0;margin-left:6px}
  .mast-row .sp{flex:1}
  .navbtn{
    width:34px;height:34px;border:1.5px solid var(--ink);display:grid;place-items:center;
    font-size:17px;font-weight:700
  }
  .navbtn:active{background:var(--ink);color:var(--paper)}

  .tabs{display:flex;gap:24px;margin-top:2px}
  .tabs button{
    padding:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);position:relative;margin-bottom:-2px
  }
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)
  }

  .wrap{max-width:820px;margin:0 auto;padding:0 18px}

  /* ---------- summary ledger ---------- */
  .ledger{
    display:flex;border-bottom:1px solid var(--hair);padding:16px 0 14px;gap:0;
  }
  .ledger .cell{flex:1;padding-right:14px}
  .ledger .cell + .cell{border-left:1px solid var(--hair);padding-left:14px}
  .ledger .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .ledger .num{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
  .ledger .num.accent{color:var(--accent)}
  .ledger .num small{font-size:13px;font-weight:600;color:var(--faint);letter-spacing:0}

  /* ---------- employee block (calendar) ---------- */
  .person{border-bottom:1px solid var(--hair);padding:16px 0 18px}
  .person-head{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
  .pindex{
    font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600;
    min-width:22px;letter-spacing:-.02em
  }
  .person-head .nm{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .person-head .role{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .person-head .sp{flex:1}
  .person-head .sum{text-align:right}
  .person-head .sum .pay{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .person-head .sum .det{font-size:10.5px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;font-variant-numeric:tabular-nums}

  /* the "ruler" of days — the signature */
  .ruler{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(0,1fr));
    grid-auto-rows:1fr;gap:0;border-left:1px solid var(--hair2);
  }
  /* mobile: 7 cols; wider: more */
  @media(max-width:560px){.ruler{grid-template-columns:repeat(7,1fr)}}
  @media(min-width:561px){.ruler{grid-template-columns:repeat(14,1fr)}}
  .tick{
    position:relative;border-right:1px solid var(--hair2);border-bottom:1px solid var(--hair2);
    border-top:1px solid var(--hair2);aspect-ratio:1/1.25;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:5px;background:transparent;transition:background .08s
  }
  .tick:active{background:var(--paper2)}
  .tick .dn{font-size:11px;font-weight:600;color:var(--ink2);line-height:1;font-variant-numeric:tabular-nums}
  .tick.we .dn{color:var(--accent)}
  .tick.on{background:var(--ink)}
  .tick.on .dn{color:var(--paper)}
  .tick .bar{
    position:absolute;left:3px;right:3px;bottom:4px;height:0;
  }
  .tick.on .bar{
    height:auto;font-size:8px;font-weight:700;color:var(--paper);text-align:center;
    line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;bottom:5px
  }
  .tick.on .bar .h{display:block;color:var(--accent);font-size:8.5px;margin-top:1px}
  .tick.today{box-shadow:inset 0 0 0 1.5px var(--accent)}

  /* ---------- people tab ---------- */
  .plist{padding-top:4px}
  .prow{
    display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--hair)
  }
  .prow .pidx{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:22px;font-weight:600}
  .prow .meta{flex:1;min-width:0}
  .prow .nm{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .prow .sub{font-size:12px;color:var(--faint);margin-top:2px;letter-spacing:.02em}
  .prow .sub b{color:var(--ink);font-weight:700}
  .editlink{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1.5px solid var(--hair);padding-bottom:2px}
  .editlink:active{color:var(--accent);border-color:var(--accent)}

  .addnew{
    width:100%;margin:18px 0 4px;padding:16px;border:1.5px dashed var(--hair);
    font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--ink2);
    display:flex;align-items:center;justify-content:center;gap:8px
  }
  .addnew:active{border-color:var(--accent);color:var(--accent)}
  .addnew .plus{font-size:17px;line-height:0}

  .empty{padding:64px 12px;text-align:center;border-bottom:1px solid var(--hair)}
  .empty .mk{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
  .empty h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
  .empty p{color:var(--faint);font-size:14px;margin:0;line-height:1.5}

  .colophon{max-width:820px;margin:0 auto;padding:20px 18px 8px;
    font-size:11px;color:var(--faint);letter-spacing:.04em;line-height:1.6;
    border-top:1px solid var(--hair);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .colophon b{color:var(--ink2);font-weight:700}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(22,20,15,.42);z-index:90;
    display:none;align-items:flex-end;justify-content:center}
  .scrim.show{display:flex}
  @media(min-width:560px){.scrim.show{align-items:center}}
  .sheet{
    background:var(--paper);width:100%;max-width:440px;
    border-top:2px solid var(--ink);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:up .2s cubic-bezier(.2,.8,.2,1)
  }
  @media(min-width:560px){.sheet{border:2px solid var(--ink)}}
  @keyframes up{from{transform:translateY(34px)}to{transform:translateY(0)}}
  .sheet-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .sheet h3{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:5px 0 2px}
  .sheet .sub{color:var(--faint);font-size:12.5px;margin-bottom:18px;letter-spacing:.02em}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .field input{
    width:100%;padding:11px 12px;background:var(--field);
    border:1px solid var(--hair);color:var(--ink);outline:none;border-radius:0;transition:border-color .1s
  }
  .field input:focus{border-color:var(--ink)}
  .two{display:flex;gap:12px}.two .field{flex:1}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .presets button{
    padding:7px 10px;border:1px solid var(--hair);font-size:11.5px;font-weight:700;
    color:var(--ink2);letter-spacing:.02em;font-variant-numeric:tabular-nums
  }
  .presets button:active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .calcbar{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
    padding:12px 0;margin:16px 0
  }
  .calcbar .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums}
  .calcbar .v{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .acts{display:flex;gap:10px;margin-top:4px}
  .btn{flex:1;padding:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;text-align:center;border:1.5px solid var(--ink)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:var(--paper)}
  .btn-ghost{background:transparent;color:var(--ink);flex:0 0 auto;padding:13px 18px}
  .btn-del{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:0 0 auto;padding:13px 16px}

  .menu-item{
    display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--hair);width:100%;text-align:left
  }
  .menu-item:active{color:var(--accent)}
  .menu-item .mk{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600;min-width:22px}
  .menu-item .t{flex:1}
  .menu-item .t .a{font-weight:700;letter-spacing:-.01em}
  .menu-item .t .b{font-size:11.5px;color:var(--faint);margin-top:1px;letter-spacing:.02em}
  .menu-item .ar{font-size:15px;color:var(--faint)}
  .menu-item.danger .a{color:var(--accent)}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:var(--paper);padding:11px 18px;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;z-index:200;opacity:0;transition:.22s;pointer-events:none
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loader{padding:70px 0;text-align:center;color:var(--faint);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  input[type=file]{display:none}

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div class="mast">
  <div class="mast-top">
    <div class="logo"><span class="sq"></span>Табель<span class="venue" id="venueName"></span></div>
    <div class="sp"></div>
    <button class="dots" id="menuBtn" aria-label="Меню">···</button>
  </div>
  <div class="mast-row">
    <div class="month" id="monthLabel"></div>
    <div class="sp"></div>
    <button class="navbtn" id="prevM" aria-label="Предыдущий месяц">‹</button>
    <button class="navbtn" id="nextM" aria-label="Следующий месяц">›</button>
  </div>
  <div class="tabs">
    <button data-tab="cal" class="on">Смены</button>
    <button data-tab="emp">Бригада</button>
  </div>
</div>

<div class="wrap" id="app"><div class="loader">Загрузка</div></div>
<div class="colophon" id="colophon"></div>

<!-- shift modal -->
<div class="scrim" id="shiftScrim"><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-kicker" id="shiftKicker">Смена</div>
  <h3 id="shiftTitle"></h3>
  <div class="sub" id="shiftSub"></div>
  <div class="two">
    <div class="field"><label for="shStart">Начало</label><input type="time" id="shStart" value="10:00"></div>
    <div class="field"><label for="shEnd">Конец</label><input type="time" id="shEnd" value="22:00"></div>
  </div>
  <div class="presets" id="presets"></div>
  <div class="calcbar"><span class="l" id="calcLbl">— ч × — ₽</span><span class="v" id="calcVal">—</span></div>
  <div class="acts">
    <button class="btn-del" id="shiftDel" style="display:none">Снять</button>
    <button class="btn btn-ghost" id="shiftCancel">Отмена</button>
    <button class="btn btn-primary" id="shiftSave">Записать</button>
  </div>
</div></div>

<!-- employee modal -->
<div class="scrim" id="empScrim"><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-kicker" id="empKicker">Бригада</div>
  <h3 id="empTitle">Новый сотрудник</h3>
  <div class="sub">Имя, должность и почасовая ставка</div>
  <div class="field"><label for="empName">Имя</label><input type="text" id="empName" placeholder="Тарасов Михаил" autocomplete="off"></div>
  <div class="field"><label for="empRole">Должность</label><input type="text" id="empRole" placeholder="Бармен" autocomplete="off"></div>
  <div class="two">
    <div class="field"><label for="empBday">День рождения</label><input type="text" id="empBday" placeholder="10 сентября" autocomplete="off"></div>
    <div class="field"><label for="empPhone">Телефон</label><input type="tel" id="empPhone" placeholder="8-919-100-82-23" autocomplete="off"></div>
  </div>
  <div class="field"><label for="empRate">Ставка · ₽ в час</label><input type="number" id="empRate" placeholder="350" inputmode="numeric"></div>
  <div class="acts">
    <button class="btn-del" id="empDel" style="display:none">Удалить</button>
    <button class="btn btn-ghost" id="empCancel">Отмена</button>
    <button class="btn btn-primary" id="empSave">Сохранить</button>
  </div>
</div></div>

<!-- menu -->
<div class="scrim" id="menuScrim"><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-kicker">Меню</div>
  <h3>Действия</h3>
  <div class="sub">Данные хранятся на этом устройстве</div>
  <button class="menu-item" id="mExport"><span class="mk">01</span><span class="t"><span class="a">Экспорт в Excel</span><span class="b">Расписание и выплаты за месяц</span></span><span class="ar">↧</span></button>
  <button class="menu-item" id="mImport"><span class="mk">02</span><span class="t"><span class="a">Импорт из Excel</span><span class="b">Загрузить файл обратно</span></span><span class="ar">↥</span></button>
  <button class="menu-item" id="mRename"><span class="mk">03</span><span class="t"><span class="a">Название заведения</span><span class="b" id="mRenameSub">Не задано</span></span><span class="ar">→</span></button>
  <button class="menu-item" id="mNote"><span class="mk">04</span><span class="t"><span class="a">Примечание к графику</span><span class="b" id="mNoteSub">Не задано</span></span><span class="ar">→</span></button>
  <button class="menu-item danger" id="mClear"><span class="mk">05</span><span class="t"><span class="a">Очистить месяц</span><span class="b">Снять все смены текущего месяца</span></span><span class="ar">×</span></button>
  <div style="height:14px"></div>
  <button class="btn btn-primary" id="menuClose" style="width:100%">Закрыть</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
</div></div>

<div class="toast" id="toast"></div>

<script>
const WK=['вс','пн','вт','ср','чт','пт','сб'];
const WKF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

let state={employees:[],shifts:{},venue:'',note:''};
let view={y:new Date().getFullYear(),m:new Date().getMonth(),tab:'cal'};
let editing={empId:null,shiftKey:null,day:null};
const TODAY=new Date();
const STORE_KEY='tabel:data';

/* storage — key-value store (localStorage for the offline single-file build) */
function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)state=JSON.parse(raw);}catch(e){}
  state.employees=state.employees||[];state.shifts=state.shifts||{};state.venue=state.venue||'';state.note=state.note||'';
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){toast('Ошибка сохранения');}
},150);}

/* helpers */
function uid(){return Math.random().toString(36).slice(2,9)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function pad(n){return String(n).padStart(2,'0')}
function key(empId,d){return empId+'|'+view.y+'-'+pad(view.m+1)+'-'+pad(d)}
function shiftHours(s){if(!s)return 0;let[a,b]=s.start.split(':').map(Number),[c,d]=s.end.split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m/60;}
function fmtMoney(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function fmtH(h){return (Math.round(h*10)/10).toString().replace('.',',')}
function ct(t){let[h,m]=(t||'').split(':');h=String(parseInt(h,10)||0);return m==='00'?h:h+':'+m;} /* "10:00"->"10", "23:30"->"23:30", "24:00"->"24" */
function fmtShift(s){return ct(s.start)+'-'+ct(s.end);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function isToday(d){return view.y===TODAY.getFullYear()&&view.m===TODAY.getMonth()&&d===TODAY.getDate()}

function empStats(empId){
  let hours=0,days=0;const emp=state.employees.find(e=>e.id===empId);
  for(let d=1;d<=dim(view.y,view.m);d++){const s=state.shifts[key(empId,d)];if(s){hours+=shiftHours(s);days++;}}
  return {hours,days,pay:hours*(emp?emp.rate:0)};
}
function totals(){let pay=0,hours=0,shifts=0;state.employees.forEach(e=>{const s=empStats(e.id);pay+=s.pay;hours+=s.hours;shifts+=s.days;});return{pay,hours,shifts};}

/* render */
function render(){
  document.getElementById('monthLabel').innerHTML=MON[view.m]+'<span class="yr">'+view.y+'</span>';
  document.getElementById('venueName').textContent=state.venue||'';
  document.getElementById('mRenameSub').textContent=state.venue||'Не задано';
  document.getElementById('mNoteSub').textContent=state.note||'Не задано';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===view.tab));
  document.getElementById('app').innerHTML=view.tab==='cal'?renderCal():renderEmp();
  bindDynamic();
  const t=totals();
  document.getElementById('colophon').innerHTML=state.employees.length?
    `<span>Бригада · <b>${state.employees.length}</b> чел.</span><span>Смен за ${MON[view.m]} · <b>${t.shifts}</b></span><span>К выплате · <b>${fmtMoney(t.pay)}</b></span>`:'';
}

function renderCal(){
  if(!state.employees.length) return emptyBlock('Нет бригады','Добавьте людей во вкладке «Бригада»,<br>затем расставляйте смены здесь.');
  const t=totals();
  let html=`<div class="ledger">
    <div class="cell"><div class="lab">К выплате</div><div class="num accent">${fmtMoney(t.pay)}</div></div>
    <div class="cell"><div class="lab">Смен</div><div class="num">${t.shifts}</div></div>
    <div class="cell"><div class="lab">Часов</div><div class="num">${fmtH(t.hours)}<small> ч</small></div></div>
  </div>`;
  const D=dim(view.y,view.m);
  state.employees.forEach((e,i)=>{
    const st=empStats(e.id);
    let ticks='';
    for(let d=1;d<=D;d++){
      const s=state.shifts[key(e.id,d)];
      const wd=new Date(view.y,view.m,d).getDay();
      const cls=['tick'];
      if(s)cls.push('on');else if(wd===0||wd===6)cls.push('we');
      if(isToday(d))cls.push('today');
      ticks+=`<button class="${cls.join(' ')}" data-emp="${e.id}" data-day="${d}" aria-label="${d} ${MON[view.m]}">
        <span class="dn">${d}</span>
        ${s?`<span class="bar">${s.start}<span class="h">${fmtH(shiftHours(s))}ч</span></span>`:''}
      </button>`;
    }
    html+=`<div class="person">
      <div class="person-head">
        <span class="pindex">${pad(i+1)}</span>
        <span class="nm">${esc(e.name)}</span>
        ${e.role?`<span class="role">${esc(e.role)}</span>`:''}
        <span class="sp"></span>
        <span class="sum"><div class="pay">${fmtMoney(st.pay)}</div><div class="det">${st.days} см · ${fmtH(st.hours)} ч · ${e.rate}₽/ч</div></span>
      </div>
      <div class="ruler">${ticks}</div>
    </div>`;
  });
  return html;
}

function renderEmp(){
  let html='<div class="plist">';
  if(!state.employees.length){
    html+=emptyBlock('Список пуст','Добавьте первого сотрудника бригады.');
  }else{
    state.employees.forEach((e,i)=>{
      const st=empStats(e.id);
      html+=`<div class="prow">
        <span class="pidx">${pad(i+1)}</span>
        <span class="meta">
          <div class="nm">${esc(e.name)}</div>
          <div class="sub">${e.role?esc(e.role)+' · ':''}<b>${e.rate} ₽/ч</b> · ${MON[view.m]}: ${fmtMoney(st.pay)}${e.phone?' · '+esc(e.phone):''}</div>
        </span>
        <button class="editlink" data-edit="${e.id}">Правка</button>
      </div>`;
    });
  }
  html+='</div>';
  html+=`<button class="addnew" id="addEmpBtn"><span class="plus">+</span> Добавить сотрудника</button>`;
  return html;
}
function emptyBlock(h,p){return `<div class="empty"><div class="mk">${MON[view.m]} ${view.y}</div><h3>${h}</h3><p>${p}</p></div>`}

function bindDynamic(){
  document.querySelectorAll('.tick').forEach(c=>c.onclick=()=>openShift(c.dataset.emp,+c.dataset.day));
  const ae=document.getElementById('addEmpBtn');if(ae)ae.onclick=()=>openEmp(null);
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEmp(b.dataset.edit));
}

/* shift modal */
function openShift(empId,d){
  editing.empId=empId;editing.shiftKey=key(empId,d);editing.day=d;
  const emp=state.employees.find(e=>e.id===empId);
  const s=state.shifts[editing.shiftKey];
  const wd=new Date(view.y,view.m,d).getDay();
  document.getElementById('shiftKicker').textContent=emp.role||'Смена';
  document.getElementById('shiftTitle').textContent=emp.name;
  document.getElementById('shiftSub').textContent=`${d} ${MON[view.m]} · ${WKF[wd]}`;
  document.getElementById('shStart').value=s?s.start:'10:00';
  document.getElementById('shEnd').value=s?s.end:'22:00';
  document.getElementById('shiftDel').style.display=s?'block':'none';
  renderPresets();updateCalc();show('shiftScrim');
}
function renderPresets(){
  const P=[['10:00','22:00'],['12:00','24:00'],['09:00','18:00'],['18:00','24:00'],['10:00','23:30']];
  const box=document.getElementById('presets');
  box.innerHTML=P.map(p=>`<button data-s="${p[0]}" data-e="${p[1]}">${p[0]}–${p[1]}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    document.getElementById('shStart').value=b.dataset.s;document.getElementById('shEnd').value=b.dataset.e;updateCalc();
  });
}
function updateCalc(){
  const emp=state.employees.find(e=>e.id===editing.empId);
  const h=shiftHours({start:document.getElementById('shStart').value,end:document.getElementById('shEnd').value});
  document.getElementById('calcLbl').textContent=`${fmtH(h)} ч × ${emp.rate} ₽`;
  document.getElementById('calcVal').textContent=fmtMoney(h*emp.rate);
}
document.getElementById('shStart').oninput=updateCalc;
document.getElementById('shEnd').oninput=updateCalc;
document.getElementById('shiftSave').onclick=()=>{
  state.shifts[editing.shiftKey]={start:document.getElementById('shStart').value,end:document.getElementById('shEnd').value};
  save();hide('shiftScrim');render();toast('Записано');
};
document.getElementById('shiftDel').onclick=()=>{delete state.shifts[editing.shiftKey];save();hide('shiftScrim');render();toast('Смена снята');};
document.getElementById('shiftCancel').onclick=()=>hide('shiftScrim');

/* employee modal */
function openEmp(id){
  editing.empId=id;
  const e=id?state.employees.find(x=>x.id===id):null;
  document.getElementById('empTitle').textContent=e?'Сотрудник':'Новый сотрудник';
  document.getElementById('empName').value=e?e.name:'';
  document.getElementById('empRole').value=e?(e.role||''):'';
  document.getElementById('empBday').value=e?(e.bday||''):'';
  document.getElementById('empPhone').value=e?(e.phone||''):'';
  document.getElementById('empRate').value=e?e.rate:'';
  document.getElementById('empDel').style.display=e?'block':'none';
  show('empScrim');
  if(!e)setTimeout(()=>document.getElementById('empName').focus(),240);
}
document.getElementById('empSave').onclick=()=>{
  const name=document.getElementById('empName').value.trim();
  const role=document.getElementById('empRole').value.trim();
  const bday=document.getElementById('empBday').value.trim();
  const phone=document.getElementById('empPhone').value.trim();
  const rate=parseFloat(document.getElementById('empRate').value)||0;
  if(!name){toast('Введите имя');return}
  if(editing.empId){const e=state.employees.find(x=>x.id===editing.empId);e.name=name;e.role=role;e.bday=bday;e.phone=phone;e.rate=rate;}
  else state.employees.push({id:uid(),name,role,bday,phone,rate});
  save();hide('empScrim');render();toast('Сохранено');
};
document.getElementById('empDel').onclick=()=>{
  if(!confirm('Удалить сотрудника и все его смены?'))return;
  Object.keys(state.shifts).forEach(k=>{if(k.startsWith(editing.empId+'|'))delete state.shifts[k]});
  state.employees=state.employees.filter(e=>e.id!==editing.empId);
  save();hide('empScrim');render();toast('Удалено');
};
document.getElementById('empCancel').onclick=()=>hide('empScrim');

/* menu */
document.getElementById('menuBtn').onclick=()=>show('menuScrim');
document.getElementById('menuClose').onclick=()=>hide('menuScrim');
document.getElementById('mRename').onclick=()=>{const v=prompt('Название заведения:',state.venue||'');if(v!==null){state.venue=v.trim();save();render();}};
document.getElementById('mNote').onclick=()=>{const v=prompt('Примечание к графику (печатается внизу выгрузки):',state.note||'');if(v!==null){state.note=v.trim();save();render();}};
document.getElementById('mClear').onclick=()=>{
  if(!confirm('Снять все смены за '+MON[view.m]+'?'))return;
  const pre='|'+view.y+'-'+pad(view.m+1)+'-';
  Object.keys(state.shifts).forEach(k=>{if(k.includes(pre))delete state.shifts[k]});
  save();render();hide('menuScrim');toast('Месяц очищен');
};

/* excel export — лист «График» в формате реального табеля заведения */
document.getElementById('mExport').onclick=()=>{
  const D=dim(view.y,view.m);
  /* шапка: Сотрудник | ДР | Телефон | дни… | Часов | Смен | К выплате */
  const FIX=['Сотрудник','ДР','Телефон'];
  const header=FIX.slice();
  for(let d=1;d<=D;d++)header.push(d+' '+MONG[view.m]);
  header.push('Часов','Смен','К выплате ₽');
  const W=header.length;
  const blank=()=>new Array(W).fill('');

  const titleRow=blank();titleRow[0]=('ГРАФИК РАБОТЫ'+(state.venue?' · '+state.venue:''))+' — '+MON[view.m]+' '+view.y;
  const rows=[titleRow,header];
  const merges=[{s:{r:0,c:0},e:{r:0,c:W-1}}]; /* заголовок на всю ширину */

  /* группировка по должности, в порядке появления; без должности — в конец */
  const groups=[];const idx={};
  state.employees.forEach(e=>{const g=(e.role||'').trim()||'Без должности';if(!(g in idx)){idx[g]=groups.length;groups.push({name:g,list:[]});}groups[idx[g]].list.push(e);});

  groups.forEach(g=>{
    const gh=blank();gh[0]=g.name.toUpperCase();rows.push(gh);
    merges.push({s:{r:rows.length-1,c:0},e:{r:rows.length-1,c:W-1}});
    g.list.forEach(e=>{
      const r=[e.name,e.bday||'',e.phone||''];let h=0,c=0;
      for(let d=1;d<=D;d++){const s=state.shifts[key(e.id,d)];if(s){r.push(fmtShift(s));h+=shiftHours(s);c++;}else r.push('');}
      r.push(Math.round(h*10)/10,c,Math.round(h*e.rate));rows.push(r);
    });
  });

  if(state.note){const nr=blank();nr[0]=state.note;rows.push(blank());rows.push(nr);
    merges.push({s:{r:rows.length-1,c:0},e:{r:rows.length-1,c:W-1}});}

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!merges']=merges;
  ws['!cols']=header.map((_,i)=>i===0?{wch:20}:i===1?{wch:13}:i===2?{wch:16}:i>=W-3?{wch:10}:{wch:8});
  ws['!freeze']={xSplit:3,ySplit:2};
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'График');

  /* служебный лист — плоский, для чистого реимпорта и будущей синхронизации с бэкендом */
  const data=[['empId','name','role','rate','phone','bday','date','start','end']];
  state.employees.forEach(e=>{
    let any=false;
    Object.keys(state.shifts).forEach(k=>{if(k.startsWith(e.id+'|')){const s=state.shifts[k];data.push([e.id,e.name,e.role||'',e.rate,e.phone||'',e.bday||'',k.split('|')[1],s.start,s.end]);any=true;}});
    if(!any)data.push([e.id,e.name,e.role||'',e.rate,e.phone||'',e.bday||'','','','']);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'_data');
  XLSX.writeFile(wb,`График_${MON[view.m]}_${view.y}.xlsx`);
  hide('menuScrim');toast('Файл скачан');
};

/* excel import */
document.getElementById('mImport').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=(ev)=>{
  const f=ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=(e)=>{try{
    const wb=XLSX.read(e.target.result,{type:'array'});
    if(wb.SheetNames.includes('_data'))importFromData(wb.Sheets['_data']);
    else importFromGrid(wb.Sheets[wb.SheetNames[0]]);
    save();render();hide('menuScrim');toast('Импортировано');
  }catch(err){toast('Не удалось прочитать файл')}};
  rd.readAsArrayBuffer(f);ev.target.value='';
};
function importFromData(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1});const map={};
  rows.slice(1).forEach(r=>{
    if(!r[1])return;const id=r[0]||uid();
    if(!map[id])map[id]={id,name:String(r[1]),role:r[2]?String(r[2]):'',rate:parseFloat(r[3])||0,phone:r[4]?String(r[4]):'',bday:r[5]?String(r[5]):''};
    if(r[6]&&r[7]&&r[8])state.shifts[id+'|'+r[6]]={start:String(r[7]),end:String(r[8])};
  });
  Object.values(map).forEach(ne=>{const ex=state.employees.find(x=>x.id===ne.id||x.name===ne.name);if(ex)Object.assign(ex,ne);else state.employees.push(ne);});
}
function importFromGrid(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1});if(!rows.length)return;
  const header=rows[0];const dayCols=[];
  header.forEach((h,i)=>{const m=String(h).match(/^(\d{1,2})/);if(m&&i>=2)dayCols.push({i,day:+m[1]});});
  rows.slice(1).forEach(r=>{
    const name=String(r[0]||'').trim();if(!name)return;
    let emp=state.employees.find(x=>x.name===name);const rate=parseFloat(r[2])||0;
    if(!emp){emp={id:uid(),name,role:r[1]?String(r[1]):'',rate};state.employees.push(emp);}else if(rate)emp.rate=rate;
    dayCols.forEach(dc=>{
      const cell=String(r[dc.i]||'').trim();
      const m=cell.match(/(\d{1,2}[:.]\d{2})\s*[–\-—]\s*(\d{1,2}[:.]\d{2})/);
      if(m)state.shifts[emp.id+'|'+view.y+'-'+pad(view.m+1)+'-'+pad(dc.day)]={start:m[1].replace('.',':'),end:m[2].replace('.',':')};
    });
  });
}

/* utils */
function show(id){document.getElementById(id).classList.add('show')}
function hide(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.scrim').forEach(s=>s.onclick=(e)=>{if(e.target===s)hide(s.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.scrim.show').forEach(s=>s.classList.remove('show'))});
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1700);}

document.getElementById('prevM').onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--}render()};
document.getElementById('nextM').onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++}render()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;render()});

load();render();
</script>
